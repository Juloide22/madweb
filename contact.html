<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contacto — MAD 3D Studio. Visualización arquitectónica, render 3D e IA. Mar del Plata, Argentina.">
  <title>Contact — MADVIZ</title>
  <link rel="icon" type="image/png" href="images/logo-bg.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-contact">

  <!-- Puntero custom dot (monopo style) -->
  <div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>

  <div class="fixed-video-bg" aria-hidden="true">
    <video class="video-bg" autoplay muted loop playsinline>
      <source src="images/video/Verona%20para%20sitio%20web.mp4" type="video/mp4">
    </video>
    <div class="video-bg__overlay" style="background: rgba(0,0,0,0.72);"></div>
    <div class="video-bg__grain"></div>
  </div>

  <div id="menu-overlay" class="menu-overlay" role="dialog" aria-modal="true">
    <div class="menu-overlay__header">
      <a href="index.html" class="menu-overlay__logo"><img src="images/logo-white.png" alt="MADVIZ"></a>
      <button class="menu-overlay__close" aria-label="Cerrar">Close</button>
    </div>
    <nav class="menu-overlay__nav">
      <a href="index.html" data-es="Inicio" data-en="Home">Inicio</a>
      <a href="archive.html" data-es="Galería" data-en="Gallery">Galería</a>
      <a href="services.html" data-es="Servicios" data-en="Services">Servicios</a>
      <a href="about.html" data-es="Nosotros" data-en="About">Nosotros</a>
      <a href="contact.html" class="is-active" data-es="Contacto" data-en="Contact">Contacto</a>
    </nav>
    <div class="menu-overlay__footer">
      <p>Mar del Plata, Argentina</p>
      <p>© 2025 MAD 3D Studio</p>
    </div>
  </div>

  <header class="site-header">
    <div class="site-header__left">
      <a href="index.html" class="site-header__logo" aria-label="MADVIZ"><img src="images/logo-white.png" alt="MADVIZ"></a>
      <div class="lang-switcher" aria-label="Idioma">
        <button class="lang-btn is-active" data-lang="es" aria-label="Español">ES</button>
        <span class="lang-sep" aria-hidden="true">/</span>
        <button class="lang-btn" data-lang="en" aria-label="English">EN</button>
      </div>
    </div>

    <div class="header-center">
      <a href="contact.html" class="header-cta-btn" data-es="INICIAR PROYECTO" data-en="START A PROJECT">INICIAR PROYECTO</a>
    </div>

    <nav class="site-nav" aria-label="Navegación principal">
      <a href="archive.html" data-es="Galería" data-en="Gallery">Galería</a>
      <a href="services.html" data-es="Servicios" data-en="Services">Servicios</a>
      <a href="about.html" data-es="Nosotros" data-en="About">Nosotros</a>
      <a href="contact.html" class="is-active" data-es="Contacto" data-en="Contact">Contacto</a>
      <button class="menu-toggle-mobile" id="menu-toggle" aria-label="Abrir menú">Menu</button>
    </nav>
  </header>

  <main class="contact-wrap">

    <div class="contact-logo fade-in">
      <a href="index.html">
        <img src="images/logo-white.png" alt="MAD 3D Studio">
      </a>
    </div>

    <div class="contact-content fade-in">

      <p class="contact-eyebrow" data-es="Trabajemos juntos" data-en="Let's work together">Trabajemos juntos</p>

      <h2 class="contact-title" data-es="Contacto" data-en="Contact">Contacto</h2>

      <a href="https://mail.google.com/mail/?view=cm&fs=1&to=studiomad.3d@gmail.com"
         target="_blank" rel="noopener"
         class="contact-email">
        studiomad.3d@gmail.com
      </a>

      <form id="quick-gmail-form" class="quick-gmail-form" onsubmit="return sendViaGmail(event);">
        <div class="form-group">
          <label for="gmail-subject" class="form-label" data-es="Asunto" data-en="Subject">Asunto</label>
          <input type="text"
                 id="gmail-subject"
                 class="form-input"
                 value="Quiero cotizar mi proyecto"
                 data-val-es="Quiero cotizar mi proyecto"
                 data-val-en="I want to quote my project"
                 required>
        </div>

        <div class="form-group">
          <label for="gmail-message" class="form-label" data-es="Mensaje" data-en="Message">Mensaje</label>
          <textarea id="gmail-message"
                    class="form-textarea"
                    rows="4"
                    placeholder="Escribe aquí los detalles de tu proyecto (tipología, renders necesarios, plazos)..."
                    data-placeholder-es="Escribe aquí los detalles de tu proyecto (tipología, renders necesarios, plazos)..."
                    data-placeholder-en="Write your project details here (typology, required renders, deadlines)..."
                    required></textarea>
        </div>

        <button type="submit" class="contact-send-btn">
          <span data-es="ENVIAR VÍA GMAIL" data-en="SEND VIA GMAIL">ENVIAR VÍA GMAIL</span>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>

      <div class="contact-divider"></div>

      <div class="contact-social">
        <a href="https://www.instagram.com/mad__viz/" target="_blank" rel="noopener">Instagram</a>
        <span class="sep">·</span>
        <a href="https://www.behance.net/madviz" target="_blank" rel="noopener">Behance</a>
      </div>

    </div>

  </main>

  <footer class="site-footer">
    <p>© 2025 MAD 3D Studio</p>
    <p>Mar del Plata, Argentina</p>
  </footer>

  <!-- GSAP Core & ScrollTrigger (locales) -->
  <script src="js/gsap.min.js"></script>
  <script src="js/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
